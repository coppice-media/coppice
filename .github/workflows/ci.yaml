name: 'Coppice Checks CI'
on:
  pull_request:
    # TODO(sea-orm): Undo
    branches:
      - '**'
      - '!breaking/sea-orm'
  push:
    branches:
      - main
      - nightly

jobs:
  code-changes-check:
    runs-on: [ubuntu-22.04]
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
      frontend-changed: ${{ steps.filter.outputs.frontend == 'true' }}
      rust-changed: ${{ steps.filter.outputs.rust == 'true' }}
      docs-changed: ${{ steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            docs:
              - './docs/**'
              - './package.json'
              - './bun.lock'
              - './bunfig.toml'
              - './.bun-version'
              - './.github/actions/setup-bun/action.yml'
            frontend:
              - './home/**'
              - './editor/**'
              - './package.json'
              - './bun.lock'
              - './bunfig.toml'
              - './.bun-version'
              - './.github/actions/setup-bun/action.yml'
            rust:
              - './apps/server/**'
              - './core/**'
              - './crates/**'
              - './.github/actions/setup-rust/action.yml'
            docker: ./docker/**

  check-rust:
    needs: code-changes-check
    if: "!contains(github.event.pull_request.head.ref, 'release/v') && needs.code-changes-check.outputs.rust-changed == 'true'"
    name: Rust checks
    runs-on: [self-hosted]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup rust
        uses: ./.github/actions/setup-rust
        with:
          cache-dependencies: false

      - name: Run cargo checks
        run: |
          cargo fmt --all -- --check
          cargo clippy -- -D warnings

      - name: Verify GraphQL schema
        run: |
          cargo dump-schema -- --check

      - name: Run tests
        run: cargo test && cargo test --features postgres-tests -p migrations

  check-coverage:
    if: "!contains(github.event.pull_request.head.ref, 'release/v') && needs.code-changes-check.outputs.rust-changed == 'true'"
    name: Coverage checks
    needs: [code-changes-check, check-rust]
    runs-on: [self-hosted]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Run coverage
        uses: ./.github/actions/coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          cache-dependencies: false

  check-typescript:
    needs: code-changes-check
    if: "!contains(github.event.pull_request.head.ref, 'release/v') && needs.code-changes-check.outputs.frontend-changed == 'true'"
    name: TypeScript checks
    runs-on: [ubuntu-22.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node and Bun
        uses: ./.github/actions/setup-bun

      - name: Run TypeScript lints
        run: bun run lint

      - name: Run TypeScript tests
        run: bun run test

      - name: Build Home and Editor
        run: bun run home build && bun run editor build

  # TODO(ci): Add vercel dev deployment?
  check-docs:
    needs: code-changes-check
    if: "!contains(github.event.pull_request.head.ref, 'release/v') && needs.code-changes-check.outputs.docs-changed == 'true'"
    name: Check documentation
    runs-on: [ubuntu-22.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node and Bun
        uses: ./.github/actions/setup-bun

      - name: Build documentation app
        run: bun run docs build
