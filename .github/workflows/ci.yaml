name: 'Coppice Checks CI'
on:
  pull_request:
    # TODO(sea-orm): Undo
    branches:
      - '**'
      - '!breaking/sea-orm'
  push:
    branches:
      - 'coppice/**'

jobs:
  code-changes-check:
    runs-on: [ubuntu-22.04]
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
      frontend-changed: ${{ steps.filter.outputs.frontend == 'true' }}
      rust-changed: ${{ steps.filter.outputs.rust == 'true' }}
      docs-changed: ${{ steps.filter.outputs.docs == 'true' }}
      contract-changed: ${{ steps.filter.outputs.contract == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            docs:
              - './docs/**'
              - './package.json'
              - './bun.lock'
              - './bunfig.toml'
              - './.bun-version'
              - './.github/actions/setup-bun/action.yml'
            frontend:
              - './packages/stump-ui/**'
              - './home/**'
              - './editor/**'
              - './package.json'
              - './bun.lock'
              - './bunfig.toml'
              - './.bun-version'
              - './.github/actions/setup-bun/action.yml'
            rust:
              - './apps/server/**'
              - './core/**'
              - './crates/**'
              - './.github/actions/setup-rust/action.yml'
              - './Cargo.toml'
              - './Cargo.lock'
              - './.github/workflows/ci.yaml'
            contract:
              - './scripts/extract-komf-contract.mjs'
              - './scripts/extract-komf-contract.test.mjs'
              - './scripts/contracts/komf-media-server.json'
              - './scripts/upstreams.json'
              - './.github/workflows/ci.yaml'
              - './.github/actions/setup-bun/action.yml'
            docker: ./docker/**

  check-rust:
    needs: code-changes-check
    if: "needs.code-changes-check.outputs.rust-changed == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)"
    name: Rust checks
    runs-on: [self-hosted]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup rust
        uses: ./.github/actions/setup-rust
        with:
          cache-dependencies: false

      - name: Run cargo checks
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets

      - name: Run workspace and server tests
        run: |
          cargo test --workspace --exclude stump_server
          cargo test -p stump_server --no-default-features --features headless,liseur-sync

      - name: Build supported server profiles
        run: |
          cargo build -p stump_server --no-default-features --features headless,liseur-sync
          cargo build -p stump_server --features full

      - name: Verify GraphQL schema
        run: cargo dump-schema -- --check

  check-coverage:
    if: "!contains(github.event.pull_request.head.ref, 'release/v') && needs.code-changes-check.outputs.rust-changed == 'true'"
    name: Coverage checks
    needs: [code-changes-check, check-rust]
    runs-on: [self-hosted]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Run coverage
        uses: ./.github/actions/coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          cache-dependencies: false

  check-typescript:
    needs: code-changes-check
    if: "!contains(github.event.pull_request.head.ref, 'release/v') && needs.code-changes-check.outputs.frontend-changed == 'true'"
    name: TypeScript checks
    runs-on: [ubuntu-22.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node and Bun
        uses: ./.github/actions/setup-bun

      - name: Check workspace types
        run: bun run check-types

      - name: Build Home and Editor
        run: bun run home build && bun run editor build

  check-komf-contract:
    needs: code-changes-check
    if: needs.code-changes-check.outputs.contract-changed == 'true'
    name: Check pinned Komf contract
    runs-on: [ubuntu-22.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/setup-bun
      - name: Exercise contract extraction edge cases
        run: bun test scripts/extract-komf-contract.test.mjs
      - name: Extract and compare the pinned contract
        run: bun run check:komf-contract
        env:
          GH_TOKEN: ${{ github.token }}

  # TODO(ci): Add vercel dev deployment?
  check-docs:
    needs: code-changes-check
    if: "!contains(github.event.pull_request.head.ref, 'release/v') && needs.code-changes-check.outputs.docs-changed == 'true'"
    name: Check documentation
    runs-on: [ubuntu-22.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Node and Bun
        uses: ./.github/actions/setup-bun

      - name: Build documentation app
        run: bun run docs build
