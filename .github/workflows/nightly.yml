name: 'Coppice Nightly CI'

on:
  pull_request:
    branches:
      - coppice/nightly
  push:
    branches:
      - coppice/nightly

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-changes-check:
    runs-on: [ubuntu-22.04]
    outputs:
      changes: ${{steps.filter.outputs.changes}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          base: 'coppice/nightly'
          filters: |
            apps: ./apps/**
            core: ./core/**
            crates: ./crates/**
            docker: ./docker/**
            packages: ./packages/**
            workflow:
              - './.github/workflows/nightly.yml'
              - './.github/actions/**'

  nightly-docker-build:
    needs: code-changes-check
    if: "needs.code-changes-check.outputs.changes != '[]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)"
    name: Build docker image
    runs-on: [self-hosted]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      # Fork snapshots are build-only. Do not publish through the inherited
      # upstream Docker Hub configuration.
      - name: Configure environment
        run: |

          if [[ ${{ github.event_name }} == 'pull_request' ]]; then
            echo "ARCHS=amd64" >> $GITHUB_ENV
          else
            echo "ARCHS=arm64,amd64" >> $GITHUB_ENV
          fi

      - name: Setup and build docker image
        uses: ./.github/actions/build-docker
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          tags: 'nightly'
          build-channel: 'nightly'
          push: 'false'
          archs: ${{ env.ARCHS }}
          discord-webhook: ${{ secrets.DISCORD_WEBHOOK }}
