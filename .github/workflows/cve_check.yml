name: CVE Check

on:
  push:
    paths:
      - .github/workflows/cve_check.yml
      - .github/actions/setup-bun/action.yml
      - .bun-version
      - bun.lock
      - bunfig.toml
      - package.json
      - apps/desktop/package.json
      - apps/web/package.json
      - docs/package.json
      - editor/package.json
      - home/package.json
      - packages/*/package.json
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  bun-audit:
    runs-on: ubuntu-latest
    # write for creating issue
    permissions:
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Setup Bun workspace
        uses: ./.github/actions/setup-bun

      - name: Run Bun audit and create issue if needed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # prevent non-zero exit from killing the job
          set +e
          AUDIT_OUTPUT=$(bun audit 2>&1)
          AUDIT_EXIT_CODE=$?
          set -e

          # bun audit exits 0 when no vulnerabilities are found
          if [ "$AUDIT_EXIT_CODE" -ne 0 ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "$AUDIT_OUTPUT"
            else
              printf '```\n%s\n```\n' "$AUDIT_OUTPUT" > issue-body.txt
              gh issue create \
                --title "[CVE] Vulnerable dependencies detected — $(date -u +%Y-%m-%d)" \
                --body-file issue-body.txt \
                --label "security"
            fi
          fi
