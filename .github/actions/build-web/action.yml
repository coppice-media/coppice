name: Compile Web Application
description: Compile Coppice web

inputs:
  app:
    description: 'The app to build, i.e. web, desktop'
    default: 'web'

runs:
  using: composite
  steps:
    - name: Checkout project
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Setup Node and Bun
      uses: ./.github/actions/setup-bun

    - name: Build app
      shell: bash
      run: bun x vite build
      working-directory: apps/${{ inputs.app }}

    - name: Upload bundle
      uses: ./.github/actions/upload-artifact
      with:
        upload-name: webapp
        upload-path: apps/${{ inputs.app }}/dist
