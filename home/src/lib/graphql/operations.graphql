# Home-app-only GraphQL operations. The shared `Me` query lives in
# packages/stump-ui/src/graphql/operations.graphql.

fragment DeviceFields on Device {
	id
	name
	kind
	transformProfile
	libraryScope
	createdAt
	lastSeenAt
	lastSyncAt
	lastSyncSummary
	telemetry {
		batteryPercent
		charging
		batterySource
		batteryObservedAt
		syncStatus
		syncProtocol
		syncedAt
		counters {
			progress
			highlights
			notes
			bookmarks
			sessions
			items
		}
	}
	revokedAt
	credential {
		kind
		protocol
		secretHint
	}
}

fragment DeviceCredentialFields on IssuedDeviceCredential {
	kind
	protocol
	credentialRef
	secret
}

fragment DeviceEndpointFields on DeviceEndpoint {
	label
	url
	username
	secretHint
}

query Devices {
	devices {
		...DeviceFields
	}
}

mutation CreateDevice($kind: DeviceKind!, $name: String, $allowKomfMetadataEditing: Boolean = false) {
	createDevice(kind: $kind, name: $name, allowKomfMetadataEditing: $allowKomfMetadataEditing) {
		device {
			...DeviceFields
		}
		credential {
			...DeviceCredentialFields
		}
		endpoints {
			...DeviceEndpointFields
		}
	}
}

mutation RenameDevice($id: String!, $name: String!) {
	renameDevice(id: $id, name: $name) {
		...DeviceFields
	}
}

mutation RotateDeviceCredential($id: String!) {
	rotateDeviceCredential(id: $id) {
		device {
			...DeviceFields
		}
		credential {
			...DeviceCredentialFields
		}
		endpoints {
			...DeviceEndpointFields
		}
	}
}

mutation RevokeDevice($id: String!) {
	revokeDevice(id: $id) {
		...DeviceFields
	}
}

mutation SetDeviceTransformProfile($id: String!, $profile: JSON) {
	setDeviceTransformProfile(id: $id, profile: $profile) {
		...DeviceFields
	}
}

# `libraryIds: null` clears the restriction so the device inherits its user's
# visibility; a list narrows it (the server intersects, never widens).
mutation SetDeviceLibraryScope($id: String!, $libraryIds: [ID!]) {
	setDeviceLibraryScope(id: $id, libraryIds: $libraryIds) {
		...DeviceFields
	}
}

# `email: null` clears the address, which also removes the device from the
# "Send to Kindle" targets on the book rows.
mutation SetDeviceKindleEmail($id: String!, $email: String) {
	setDeviceKindleEmail(id: $id, email: $email) {
		...DeviceFields
	}
}

query PendingDevicePairings {
	pendingDevicePairings {
		id
		kind
		name
		remoteIp
		status
		failedAttempts
		credentialIssued
		createdAt
		expiresAt
		approvedAt
	}
}

mutation ApproveDevicePairing($pairingId: ID!, $code: String, $allowKomfMetadataEditing: Boolean = false) {
	approveDevicePairing(pairingId: $pairingId, code: $code, allowKomfMetadataEditing: $allowKomfMetadataEditing) {
		id
		status
	}
}

mutation DenyDevicePairing($pairingId: ID!) {
	denyDevicePairing(pairingId: $pairingId) {
		id
		status
	}
}

subscription DeviceSeen($deviceId: String) {
	deviceSeen(deviceId: $deviceId) {
		deviceId
		userId
		protocol
	}
}

query ReadingStats($span: ReadingStatsSpan!, $deviceId: String) {
	readingStats(span: $span, deviceId: $deviceId) {
		from
		to
		sessions
		minutes
		pages
		booksFinished
		streakDays
		days {
			date
			sessions
			minutes
			pages
		}
		devices {
			deviceId
			name
			kind
			sessions
			minutes
			pages
		}
	}
}

query MyLoginActivity($userId: ID!) {
	loginActivityById(id: $userId) {
		id
		ipAddress
		userAgent
		authenticationSuccessful
		timestamp
	}
}
# Runtime component controls and server capability descriptors. The resolver
# enforces owner access for the mutation; the read-only descriptors are used to
# keep client setup honest when a protocol was not compiled or is disabled.
query RuntimeComponents {
	runtimeComponents {
		key
		label
		description
		category
		compiled
		desiredEnabled
		effectiveEnabled
		transitionMode
		transitionReason
		dependencies
		health
		restartRequired
		usageStatus
		usageEvidence
		activityCount
		lastActivityAt
		lastTransitionAt
		lastError
		ownedGauges {
			name
			kind
			value
		}
	}
	runtimeMemory {
		totalProcessRssBytes
		rssAvailable
		rssUnavailableReason
		anonymousPssBytes
		fileBackedPssBytes
		privateDirtyBytes
		memoryBreakdownAvailable
		memoryBreakdownUnavailableReason
	}
}

mutation SetRuntimeComponentEnabled($key: String!, $enabled: Boolean!) {
	setRuntimeComponentEnabled(key: $key, enabled: $enabled) {
		key
		label
		description
		category
		compiled
		desiredEnabled
		effectiveEnabled
		transitionMode
		transitionReason
		dependencies
		health
		restartRequired
		usageStatus
		usageEvidence
		activityCount
		lastActivityAt
		lastTransitionAt
		lastError
		ownedGauges {
			name
			kind
			value
		}
	}
}

query DeviceCapabilities {
	deviceCapabilities {
		kind
		protocol
		componentKey
		compiled
		enabled
		available
		reason
	}
}
