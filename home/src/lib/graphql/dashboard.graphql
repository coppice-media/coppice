# Console dashboard and notification-settings operations. Kept in their own
# document so the dashboard, library, and reader screens never edit the same
# file; codegen unions every `src/lib/graphql/**/*.graphql`.

# `permissions` is a self-guarded field, so this is the current user's own set.
# The job-queue widget is only mounted when it contains READ_JOBS (or the user
# owns the server, which bypasses every permission guard).
query DashboardViewer {
	me {
		id
		username
		isServerOwner
		permissions
	}
}

# `readProgress` is the head (`reading_heads`): `percentageCompleted` is the
# whole-publication progression every lane writes, `page` is the better label
# for a paged book, and `positionMs` (against `audio.durationMs`) is the
# audiobook twin of both.
fragment DashboardBookCard on Media {
	id
	resolvedName
	extension
	pages
	createdAt
	seriesId
	thumbnail {
		url
	}
	series {
		id
		resolvedName
	}
	audio {
		durationMs
	}
	readProgress {
		page
		positionMs
		percentageCompleted
		elapsedSeconds
		updatedAt
	}
}

query DashboardKeepReading($pagination: Pagination!) {
	keepReading(pagination: $pagination) {
		nodes {
			...DashboardBookCard
		}
	}
}

query DashboardRecentlyAdded($pagination: Pagination!) {
	recentlyAddedMedia(pagination: $pagination) {
		nodes {
			...DashboardBookCard
		}
	}
}

query DashboardJobs($pagination: Pagination!) {
	jobs(pagination: $pagination) {
		nodes {
			id
			name
			description
			status
			msElapsed
			createdAt
			completedAt
		}
	}
}

# The *Recent highlights* widget: the newest annotations across every book
# and source. The hub (`/annotations`) reads the full `ConsoleAnnotationFields`
# shape; the widget only needs what fits on one row.
query DashboardRecentAnnotations($pageSize: Int!) {
	annotations(pagination: { page: 1, pageSize: $pageSize }) {
		total
		items {
			id
			kind
			source
			sourceDeviceName
			excerpt
			note
			chapterTitle
			page
			createdAt
			book {
				key
				mediaId
				title
			}
		}
	}
}

# `/account`: the shared `Me` query (packages/stump-ui) carries what the shell
# needs; the account screen wants the rest of the profile as well.
query AccountProfile {
	me {
		id
		username
		isServerOwner
		oidcEmail
		createdAt
		lastLogin
		loginSessionsCount
		maxSessionsAllowed
		finishedReadingSessionsCount
		permissions
		avatar {
			url
		}
		preferences {
			appTheme
			locale
		}
	}
}

# Server owners can end every session of an account, their own included; a
# regular user has no self-service equivalent, so `/account` only offers it
# to owners.
mutation AccountSignOutEverywhere($id: ID!) {
	deleteUserSessions(id: $id)
}

# The same stream the web UI's `useCoreEvent` hook reads, narrowed to what the
# dashboard shows live. `JobQueueStatus` carries the queued+running count
# bucketed by job kind, `JobUpdate` carries per-job progress while it runs, and
# `DeviceSeen` lets the sync widget refresh without polling.
subscription DashboardLiveEvents {
	readEvents {
		__typename
		... on JobStarted {
			id
		}
		... on JobUpdate {
			id
			status
			message
			subtitle
			completedTasks
			remainingTasks
		}
		... on JobOutput {
			id
		}
		... on DeviceSeen {
			deviceId
			protocol
		}
		# Emitted only on a transition, so `OK` here *is* "recovered". `status`
		# is aliased because `JobUpdate.status` above shares the response key
		# with an incompatible type (`JobStatus` vs `String!`).
		... on ProviderSourceHealthChanged {
			sourceId
			name
			healthStatus: status
		}
		... on JobQueueStatus {
			count
			countByType
		}
	}
}

query NotificationSettings {
	notificationChannels {
		id
		label
		settings {
			key
			label
			valueType
			required
			secret
			defaultValue
			description
			helpUrl
		}
	}
	notificationRules {
		id
		eventKind
		channelId
		enabled
	}
	notificationChannelSettings {
		channelId
		values
	}
}

mutation SetNotificationRule($eventKind: NotificationKind!, $channelId: String!, $enabled: Boolean!) {
	setNotificationRule(eventKind: $eventKind, channelId: $channelId, enabled: $enabled) {
		id
		eventKind
		channelId
		enabled
	}
}

mutation SetNotificationChannelSettings($input: SetNotificationChannelSettingsInput!) {
	setNotificationChannelSettings(input: $input) {
		channelId
		values
	}
}

mutation TestNotificationChannel($channelId: String!) {
	testNotificationChannel(channelId: $channelId)
}
