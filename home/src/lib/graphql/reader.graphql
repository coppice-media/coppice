# Reader-screen GraphQL operations (`/reader/[mediaId]`).
#
# Names are prefixed `Reader*` because codegen merges every document in
# `src/lib/graphql/**/*.graphql` into one set where operation and fragment
# names must be unique.

fragment ReaderLocatorFields on ReadiumLocator {
	chapterTitle
	href
	title
	type
	locations {
		fragments
		progression
		position
		totalProgression
		cssSelector
		partialCfi
	}
	text {
		before
		highlight
		after
	}
}

query ReaderBook($id: ID!) {
	mediaById(id: $id) {
		id
		resolvedName
		extension
		pages
		seriesId
		series {
			id
			name
		}
		readProgress {
			page
			# The audiobook head: milliseconds from the start of the
			# publication, null for a book that has never been listened to.
			positionMs
			percentageCompleted
			elapsedSeconds
			updatedAt
			locator {
				...ReaderLocatorFields
			}
		}
		# Null for everything that is not an audiobook, so this doubles as the
		# discriminator the reader branches on. Every time value here is
		# milliseconds from the start of the publication, never from the start
		# of a file.
		audio {
			durationMs
			codec
			chapterSource
			tracks {
				index
				mime
				durationMs
				startOffsetMs
				byteSize
				url
			}
			chapters {
				index
				title
				startMs
				endMs
			}
		}
	}
}

query ReaderVisiblePages($id: ID!) {
	mediaVisiblePages(id: $id)
}

query ReaderAnnotations($id: ID!) {
	annotations(filter: { mediaId: $id }, pagination: { page: 1, pageSize: 1000 }) {
		items {
			id
			kind
			source
			sourceDeviceId
			sourceDeviceName
			revision
			lastEditedSource
			lastEditedAt
			editable
			chapterTitle
			href
			fragment
			page
			progression
			excerpt
			note
			color
		}
	}
	annotationsByMediaId(id: $id) {
		id
		annotationText
		locator {
			...ReaderLocatorFields
		}
	}
}

mutation ReaderUpdateProgress($id: ID!, $input: MediaProgressInput!) {
	updateMediaProgress(id: $id, input: $input) {
		id
		endPage
		endPercentage
		endLocator {
			...ReaderLocatorFields
		}
	}
}

# The "Also available as" row. Split out of `ReaderBook` on purpose:
# `editionSuggestions` runs the pairing heuristics, which may call out to
# Audnexus or Open Library, and opening a book must not wait for that.
# `editions` is the cheap half — a confirmed pair is two link rows.
query ReaderEditions($id: ID!) {
	mediaById(id: $id) {
		audio {
			durationMs
		}
		editions {
			id
			resolvedName
			extension
			# Non-null exactly for an audiobook, so it tells the row which
			# reader "Open here" is heading for.
			audio {
				durationMs
			}
			# This edition's position, derived from the reader's real position
			# in the book being viewed. Null when there is nothing to convert
			# or the position falls in unmapped front matter.
			pairedPosition(fromMediaId: $id) {
				sourceMediaId
				positionMs
				progression
				confidence
				approximate
				locator {
					...ReaderLocatorFields
				}
			}
		}
		editionSuggestions {
			workId
			status
			evidence
			media {
				id
				resolvedName
				extension
			}
		}
	}
}

mutation ReaderConfirmEditionPair($mediaIdA: ID!, $mediaIdB: ID!) {
	confirmEditionPair(mediaIdA: $mediaIdA, mediaIdB: $mediaIdB) {
		workId
		status
		changed
		message
		chapterMapEntries
	}
}

mutation ReaderRejectEditionPair($mediaIdA: ID!, $mediaIdB: ID!) {
	rejectEditionPair(mediaIdA: $mediaIdA, mediaIdB: $mediaIdB) {
		workId
		status
		changed
		message
	}
}

query ReaderChapterMapMedia($id: ID!) {
	mediaById(id: $id) {
		ebook {
			spine {
				idref
				id
				linear
			}
		}
		audio {
			chapters {
				index
				title
			}
		}
	}
}

query ReaderChapterMap($ebookMediaId: ID!, $audioMediaId: ID!) {
	chapterMap(ebookMediaId: $ebookMediaId, audioMediaId: $audioMediaId) {
		ebookMediaId
		audioMediaId
		ebookSpineIndex
		audioChapterIndex
		confidence
	}
}

mutation ReaderSetChapterMapEntry(
	$ebookMediaId: ID!
	$audioMediaId: ID!
	$ebookSpineIndex: Int!
	$audioChapterIndex: Int!
	$confidence: Float
) {
	setChapterMapEntry(
		ebookMediaId: $ebookMediaId
		audioMediaId: $audioMediaId
		ebookSpineIndex: $ebookSpineIndex
		audioChapterIndex: $audioChapterIndex
		confidence: $confidence
	) {
		ebookMediaId
		audioMediaId
		ebookSpineIndex
		audioChapterIndex
		confidence
	}
}

mutation ReaderClearChapterMapEntry(
	$ebookMediaId: ID!
	$audioMediaId: ID!
	$ebookSpineIndex: Int!
) {
	clearChapterMapEntry(
		ebookMediaId: $ebookMediaId
		audioMediaId: $audioMediaId
		ebookSpineIndex: $ebookSpineIndex
	)
}
