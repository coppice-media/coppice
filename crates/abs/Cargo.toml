[package]
name = "stump_abs"
version.workspace = true
edition = "2021"
description = "Serde contract types and routes for the client-derived Audiobookshelf compatibility API"

[dependencies]
async-trait.workspace = true
axum.workspace = true
axum-extra = { version = "0.10.0", features = ["query"] }
base64.workspace = true
chrono.workspace = true
jsonwebtoken = "9.3.0"
models = { path = "../models", default-features = false }
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
stump_auth = { path = "../auth" }
thiserror.workspace = true
tracing = { workspace = true }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tests = { path = "../tests" }
tower = { version = "0.5", features = ["util"] }
