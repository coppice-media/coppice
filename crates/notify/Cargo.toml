[package]
name = "stump_notify"
version.workspace = true
edition = "2021"
description = "Notification channels (ntfy, email, webhook), routing rules, and retry policy"

[features]
default = ["ntfy", "email", "webhook"]
# ntfy.sh-compatible push channel (HTTP POST, links `reqwest`)
ntfy = ["dep:reqwest"]
# SMTP channel over the `email` crate
email = ["dep:email"]
# Signed JSON webhook channel (HMAC-SHA256 via `ring`, links `reqwest`)
webhook = ["dep:reqwest", "dep:ring"]
graphql = ["dep:async-graphql"]

[dependencies]
async-graphql = { workspace = true, optional = true }
async-trait.workspace = true
base64.workspace = true
email = { path = "../email", default-features = false, optional = true }
rand.workspace = true
reqwest = { workspace = true, optional = true }
ring = { version = "0.17.8", optional = true }
serde.workspace = true
serde_json.workspace = true
data-encoding.workspace = true
strum.workspace = true
thiserror.workspace = true
stump_api_types = { path = "../api-types" }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
