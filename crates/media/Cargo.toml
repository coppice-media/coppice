[package]
name = "stump_media"
version.workspace = true
edition = "2021"

[features]
default = ["pdf", "rar", "turbojpeg", "fast-resize", "kepub"]
pdf = ["dep:pdfium-render"]
rar = ["dep:unrar"]
turbojpeg = ["dep:turbojpeg"]
fast-resize = ["dep:fast_image_resize"]
kepub = ["dep:stump_kepub"]

[dependencies]
alphanumeric-sort.workspace = true
async-stream.workspace = true
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
data-encoding.workspace = true
epub.workspace = true
fast_image_resize = { workspace = true, optional = true }
filetime = "0.2.25"
futures-util.workspace = true
globset.workspace = true
image = { version = "0.25.2", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
imagesize = "0.14.0"
infer.workspace = true
itertools.workspace = true
kmeans_colors = { version = "0.7.1", default-features = false, features = ["palette_color"] }
libc = "0.2.152"
md5.workspace = true
merge = "0.1.0"
# Audiobook probing: MP4 `chpl` / chapter-track marks and `covr` artwork.
# `symphonia-format-isomp4` reads neither, and `mp4ameta` is the only library
# that distinguishes the two MP4 chapter mechanisms — that distinction is the
# `AudioChapterSource` provenance Stump stores.
mp4ameta.workspace = true
models = { path = "../models", default-features = false }
palette = "0.7.6"
pdfium-render = { version = "0.9.1", optional = true }
quick-xml.workspace = true
regex.workspace = true
ring = "0.17.8"
rust_decimal.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
# Audiobook probing: the one demuxer for duration, codec, sample rate,
# channels, tags, cover art, and ID3v2/Vorbis chapter marks.
symphonia.workspace = true
stump_kepub = { path = "../kepub", default-features = false, optional = true }
thiserror.workspace = true
thumbhash = "0.1.0"
tokio.workspace = true
tokio-util = "0.7.10"
tracing.workspace = true
trash = "3.1.2"
turbojpeg = { workspace = true, optional = true }
walkdir = "2.5.0"
unrar = { version = "0.5.6", optional = true }
urlencoding.workspace = true
webp = "0.3.0"
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
