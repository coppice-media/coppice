[package]
name = "stump_media"
version.workspace = true
edition = "2021"

[features]
default = ["pdf", "rar"]
pdf = ["dep:pdfium-render"]
rar = ["dep:unrar"]

[dependencies]
alphanumeric-sort.workspace = true
base64.workspace = true
chrono.workspace = true
data-encoding.workspace = true
epub.workspace = true
globset.workspace = true
image = { version = "0.25.2", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
imagesize = "0.14.0"
infer.workspace = true
itertools.workspace = true
kmeans_colors = { version = "0.7.1", default-features = false, features = ["palette_color"] }
libc = "0.2.152"
md5.workspace = true
merge = "0.1.0"
models = { path = "../models", default-features = false }
palette = "0.7.6"
pdfium-render = { version = "0.9.1", optional = true }
quick-xml.workspace = true
regex.workspace = true
ring = "0.17.8"
rust_decimal.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
thiserror.workspace = true
thumbhash = "0.1.0"
tokio.workspace = true
tokio-util = "0.7.10"
tracing.workspace = true
trash = "3.1.2"
unrar = { version = "0.5.6", optional = true }
urlencoding.workspace = true
walkdir = "2.5.0"
webp = "0.3.0"
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
