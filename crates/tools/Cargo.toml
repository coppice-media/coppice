[package]
name = "stump_tools"
version.workspace = true
edition = "2021"

[dependencies]
stump_media = { path = "../media", default-features = false }
stump_scanner = { path = "../scanner" }

alphanumeric-sort.workspace = true
# `dcterms:modified` timestamps for the EPUB 3 upgrade (`epub-polish`).
chrono.workspace = true
epub.workspace = true
# `audio-report` resolves an audiobook folder through
# `PathUtils::dir_is_audio_book`, which takes the scanner's ignore rules.
globset.workspace = true
# `audio-chapters` writes ID3v2 `CHAP`/`CTOC` frames into an MP3.
id3.workspace = true
# `audio-chapters` writes a Nero `chpl` chapter list into an M4B/M4A. Same
# library `stump_media::audio` reads the two MP4 chapter mechanisms with, so a
# mark this tool writes is a mark the probe reports.
mp4ameta.workspace = true
quick-xml.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
# Atomic output: tools stage into a temp file next to the target, then rename.
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
urlencoding.workspace = true
uuid.workspace = true
zip.workspace = true

[dev-dependencies]
# Synthesises decodable page images for the `webp-convert` fixtures; the same
# version `stump_media` already builds against, so no new lockfile entry.
image = { version = "0.25.2", default-features = false, features = ["jpeg", "png", "webp"] }
pretty_assertions.workspace = true
