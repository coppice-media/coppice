[package]
name = "graphql"
edition = "2021"
version.workspace = true

[[bin]]
name = "graphql-gen"
path = "bin/main.rs"

[features]
# Default so `cargo dump-schema` emits the provider and web ops; the server
# picks the set explicitly through its own `providers`/`webui` features.
default = ["providers", "web"]
providers = ["dep:stump_provider", "stump_core/providers"]
# Resolvers no client other than the upstream React SPA (`packages/browser`)
# and the Expo app reaches: book clubs, smart lists + smart-list views, custom
# emoji, viewer preferences + navigation arrangement, and the multipart upload
# lane. The SvelteKit editor/home apps and every protocol adapter (OPDS,
# Komga, Kobo, KOReader, liseur-sync) are unaffected.
web = []

[dependencies]
alphanumeric-sort.workspace = true
async-graphql.workspace = true
async-stream.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
croner.workspace = true
epub.workspace = true
heck.workspace = true
filter-gen = { path = "../macros/filter-gen" }
futures-util.workspace = true
infer.workspace = true
itertools.workspace = true
linemux = { git = "https://github.com/jmagnuson/linemux.git", rev = "acaafc602afac5d7a9cd3e087dafc937cac1e364" }
metadata_integrations = { path = "../integrations/metadata", default-features = false, features = ["graphql"] }
models = { path = "../models", default-features = false, features = ["graphql"] }
num-traits.workspace = true
email = { path = "../email", default-features = false, features = ["graphql"] }
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
slugify.workspace = true
strum.workspace = true
stump_annotation_sync = { path = "../annotation-sync" }
stump_auth = { path = "../auth" }
stump_api_types = { path = "../api-types" }
stump_collections = { path = "../collections" }
# `ingest`: the ingest resolvers call `Ctx::ingest` unconditionally (the server
# profile that drops the ingest pipeline drops this whole crate with it).
stump_core = { path = "../../core", default-features = false, features = ["graphql", "ingest"] }
stump_ingest = { path = "../ingest" }
stump_library = { path = "../library" }
stump_devices = { path = "../devices", features = ["graphql"] }
stump_notify = { path = "../notify" }
stump_media = { path = "../media", default-features = false }
stump_scanner = { path = "../scanner" }
# `boko-convert` for the send-to-Kindle lane (shells out to the operator's
# own boko; nothing GPL is linked).
stump_tools = { path = "../tools" }
# The send-to-Kindle lane converts into a temporary directory under the
# server's cache dir and removes it with the resolver.
tempfile.workspace = true
subtle.workspace = true
stump_provider = { path = "../provider", optional = true }
tower-sessions.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
tracing.workspace = true
zip.workspace = true
bcrypt.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58.0", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
maplit.workspace = true
pretty_assertions.workspace = true
async-graphql-axum.workspace = true
tests = { path = "../tests" }
