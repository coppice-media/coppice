[package]
name = "stump_annotation_sync"
version.workspace = true
edition = "2021"
description = "Canonical annotation export model and pluggable export sinks (markdown, git)"

[features]
default = ["git"]
# The git sink links libgit2 (system install preferred, vendored fallback via
# cc). default-features = false keeps libssh2/openssl out of the build; local
# transports and the system libgit2's https/ssh support are used at runtime.
git = ["dep:git2"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
models = { path = "../models", default-features = false }
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
stump_api_types = { path = "../api-types" }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true
git2 = { version = "0.21.0", default-features = false, optional = true }

[dev-dependencies]
tempfile.workspace = true
tests = { path = "../tests" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
