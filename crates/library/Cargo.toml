[package]
name = "stump_library"
version.workspace = true
edition = "2021"

[dependencies]
chrono.workspace = true
metadata_integrations = { path = "../integrations/metadata", default-features = false }
models = { path = "../models", default-features = false }
sea-orm.workspace = true
serde_json.workspace = true
sha2 = "0.10"
stump_core = { path = "../../core", default-features = false }
stump_media = { path = "../media", default-features = false }
stump_worker = { path = "../worker", default-features = false, features = ["server"] }
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
metadata_integrations = { path = "../integrations/metadata", default-features = false, features = [
	"mock",
] }
migrations = { path = "../migrations", default-features = false }
tempfile.workspace = true
tests = { path = "../tests" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
