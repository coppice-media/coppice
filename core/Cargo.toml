[package]
name = "stump_core"
version.workspace = true
edition = "2021"
[features]
default = ["pdf", "rar"]
graphql = [
	"dep:async-graphql",
	"models/graphql",
	"email/graphql",
	"metadata_integrations/graphql",
]
pdf = ["stump_media/pdf"]
rar = ["stump_media/rar"]


[dependencies]
alphanumeric-sort.workspace = true
apalis.workspace = true
apalis-cron.workspace = true
notify = "8.0.0"
async-channel = "2.1.0"
async-trait.workspace = true
chrono.workspace = true
croner.workspace = true
dashmap = "6.1.0"
tokio-util = "0.7.10"
async-graphql = { workspace = true, optional = true }
data-encoding = "2.5.0"
rust_decimal.workspace = true
derive_builder.workspace = true
derivative.workspace = true
dirs = "5.0.1"
email = { path = "../crates/email", default-features = false }
epub.workspace = true
futures.workspace = true
globset = "0.4.14"
image = { version = "0.25.2", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
imagesize = "0.14.0"
infer.workspace = true
itertools.workspace = true
metadata_integrations = { path = "../crates/integrations/metadata", default-features = false }
migrations = { path = "../crates/migrations", default-features = false }
models = { path = "../crates/models", default-features = false }
stump_media = { path = "../crates/media", default-features = false }
stump_scanner = { path = "../crates/scanner" }
md5.workspace = true
natord.workspace = true
rand.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde-xml-rs = "0.6.0" # Support for XML serialization/deserialization
serde_json.workspace = true
serde_with.workspace = true
simple_crypt.workspace = true
stump-config-gen = { path = "../crates/macros/stump-config-gen"}
tokio.workspace = true
toml.workspace = true
trash = "3.1.2"
prefixed-api-key = { workspace = true}
regex.workspace = true
ring = "0.17.8"
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing-appender = "0.2.3"
unicode-normalization.workspace = true
urlencoding.workspace = true
uuid.workspace = true
walkdir = "2.5.0"
webp = "0.3.0"
xml-rs = "1.0.0" # XML reader/writer
zip.workspace = true
quick-xml = { version = "0.38.3", features = ["serialize"] }
merge = "0.1.0"
kmeans_colors = { version = "0.7.1", default-features = false, features = ["palette_color"] }
palette = "0.7.6"
thumbhash = "0.1.0"
base64.workspace = true

[dev-dependencies]
temp-env = "0.3.6"
tempfile.workspace = true
criterion = { version = "0.5.1", features = ["html_reports", "async_tokio"] }
tests = { path = "../crates/tests" }

[build-dependencies]
chrono.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.152"

[[bench]]
name    = "bench_main"
harness = false
