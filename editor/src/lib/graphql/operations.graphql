mutation ApplyIngestMetadata($input: ApplyIngestMetadataInput!) {
	applyIngestMetadata(input: $input) {
		dropItem {
			...IngestDropItemFields
		}
		media {
			id
			name
			resolvedName
		}
	}
}

mutation BulkApplyIngestMetadata($input: BulkApplyIngestMetadataInput!) {
	bulkApplyIngestMetadata(input: $input) {
