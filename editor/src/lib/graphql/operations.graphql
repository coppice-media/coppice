fragment IngestDropItemFields on IngestDropItem {
	id
	libraryId
	createdBy
	filename
	relativePath
	sizeBytes
	sourceSha256
	mediaType
	status
	revision
	pendingFields
	error
	createdAt
	updatedAt
	analysisJob {
		id
		dropItemId
		jobId
		status
		phase
		priorityScore
		attempt
		queuedAt
		startedAt
		completedAt
		error
	}
	qualityReport {
		id
		dropItemId
		sourceSha256
		algorithmVersion
		score
		generatedAt
		checks {
			checkId
			label
			status
			weight
			normalizedScore
			contribution
			evidence
		}
	}
	metadataCandidates {
		id
		dropItemId
		provider
		providerVersion
		model
		confidence
		fields
		fieldConfidences
		sourceSha256
		provenance
		status
		createdAt
	}
	media {
		id
		name
	}
	series {
		id
		name
	}
}

fragment IngestPageInfoFields on PaginationInfo {
	... on OffsetPaginationInfo {
		totalPages
		totalItems
		currentPage
		pageSize
	}
	... on CursorPaginationInfo {
		currentCursor
		nextCursor
		limit
	}
}

query Libraries($pagination: Pagination!) {
	libraries(pagination: $pagination) {
		nodes {
			id
			name
			emoji
		}
		pageInfo {
			...IngestPageInfoFields
		}
	}
}

query IngestDropFolderAndItems(
	$libraryId: ID!
	$status: IngestDropItemStatus
	$pagination: Pagination!
) {
	ingestDropFolder(libraryId: $libraryId) {
		libraryId
		displayPath
		enabled
		pendingCount
		lastDiscoveredAt
	}
	ingestDropItems(libraryId: $libraryId, status: $status, pagination: $pagination) {
		nodes {
			...IngestDropItemFields
		}
		pageInfo {
			...IngestPageInfoFields
		}
	}
}

query IngestItem($id: ID!) {
	ingestItem(id: $id) {
		...IngestDropItemFields
	}
}

query IngestAnalysisQueue($status: JobStatus, $pagination: Pagination!) {
	ingestAnalysisQueue(status: $status, pagination: $pagination) {
		nodes {
			id
			dropItemId
			jobId
			status
			phase
			priorityScore
			attempt
			queuedAt
			startedAt
			completedAt
			error
		}
		pageInfo {
			...IngestPageInfoFields
		}
	}
}

query IngestAnalysisJob($id: ID!) {
	ingestAnalysisJob(id: $id) {
		id
		dropItemId
		jobId
		status
		phase
		priorityScore
		attempt
		queuedAt
		startedAt
		completedAt
		error
	}
}

query IngestReworkItems($minScore: Float, $pagination: Pagination!) {
	ingestReworkItems(minScore: $minScore, pagination: $pagination) {
		nodes {
			item {
				...IngestDropItemFields
			}
			reasons {
				checkId
				status
				message
			}
		}
		pageInfo {
			...IngestPageInfoFields
		}
	}
}

query IngestBulkItems($ids: [ID!]!) {
	ingestBulkItems(ids: $ids) {
		...IngestDropItemFields
	}
}

query IngestProviderCatalog($includeDisabled: Boolean!) {
	ingestProviderCatalog(includeDisabled: $includeDisabled) {
		id
		name
		version
		configured
		capabilities
		supportedMediaTypes
		enabledByDefault
		requiresApiToken
		helpUrl
		settings {
			key
			label
			valueType
			required
			secret
			defaultValue
			description
			helpUrl
		}
	}
}

query IngestProviderSettings($providerId: String!) {
	ingestProviderSettings(providerId: $providerId) {
		provider {
			id
			name
			version
			configured
			capabilities
			supportedMediaTypes
			enabledByDefault
			requiresApiToken
			helpUrl
			settings {
				key
				label
				valueType
				required
				secret
				defaultValue
				description
				helpUrl
			}
		}
		enabled
		optedIn
		settings {
			key
			configured
			secret
			value
		}
		updatedAt
	}
}

query IngestQualityCheckCatalog($includeDisabled: Boolean!) {
	ingestQualityCheckCatalog(includeDisabled: $includeDisabled) {
		id
		name
		version
		available
		weight
		enabled
		supportedMediaTypes
		settings {
			key
			label
			valueType
			required
			secret
			defaultValue
			description
		}
	}
}

query IngestQualityCheckSettings($checkId: String!) {
	ingestQualityCheckSettings(checkId: $checkId) {
		checkId
		enabled
		settings {
			key
			configured
			secret
			value
		}
		updatedAt
	}
}

fragment MetadataPolicyFields on MetadataPolicy {
	libraryId
	hasLibraryOverride
	fields {
		field
		providers
		strategy
		lockRespected
		overridden
		storable
	}
	audio {
		singleFileWeight
		autoAssemble
		autoChapters
		keepOriginal
		overridden
	}
}

query MetadataPolicy($libraryId: ID!) {
	metadataPolicy(libraryId: $libraryId) {
		...MetadataPolicyFields
	}
}

mutation SetMetadataPolicy($libraryId: ID!, $input: MetadataPolicyInput!) {
	setMetadataPolicy(libraryId: $libraryId, input: $input) {
		...MetadataPolicyFields
	}
}

mutation StageIngestUploads($input: StageIngestUploadsInput!) {
	stageIngestUploads(input: $input) {
		items {
