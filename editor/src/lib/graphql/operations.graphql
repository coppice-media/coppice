subscription IngestProgress(
	$libraryId: ID
	$dropItemId: ID
	$analysisJobId: ID
	$afterEventId: ID
) {
	ingestProgress(
		libraryId: $libraryId
		dropItemId: $dropItemId
		analysisJobId: $analysisJobId
		afterEventId: $afterEventId
	) {
		eventId
		emittedAt
		libraryId
		dropItemId
		analysisJobId
		status
		phase
		completed
		total
		score
		message
	}
}

query IngestProviderSearch($query: String!, $mediaKind: IngestMediaKind, $providers: [String!], $limit: Int) {
	ingestProviderSearch(query: $query, mediaKind: $mediaKind, providers: $providers, limit: $limit) {
		providerId
		externalId
		title
		year
		coverUrl
		summary
		score
	}
}

mutation LookupIngestCandidate($dropItemId: ID!, $providerId: String!, $externalId: String!) {
	lookupIngestCandidate(dropItemId: $dropItemId, providerId: $providerId, externalId: $externalId) {
		id
		dropItemId
		provider
		providerVersion
		model
		confidence
		fields
		fieldConfidences
		sourceSha256
		provenance
		status
		createdAt
	}
}
