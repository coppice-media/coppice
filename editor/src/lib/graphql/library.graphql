query LibraryMedia($filter: MediaFilterInput!, $pagination: Pagination!) {
	media(filter: $filter, pagination: $pagination) {
		nodes {
			id
			name
			resolvedName
			path
			pages
			libraryId
			thumbnail {
				url
			}
			series {
				id
				name
			}
		}
		pageInfo {
			...IngestPageInfoFields
		}
	}
}

query IngestMediaQualityScore($mediaId: ID!) {
	ingestMediaQualityReport(mediaId: $mediaId) {
		id
		score
	}
}

query IngestMediaQualityReport($mediaId: ID!) {
	ingestMediaQualityReport(mediaId: $mediaId) {
		id
		score
		algorithmVersion
		generatedAt
		checks {
			checkId
			label
			status
			weight
			contribution
			normalizedScore
			evidence
		}
	}
}

query IngestMediaMetadataCandidates($mediaId: ID!) {
	ingestMediaMetadataCandidates(mediaId: $mediaId) {
		id
		dropItemId
		provider
		providerVersion
		model
		confidence
		fields
		fieldConfidences
		sourceSha256
		provenance
		status
		createdAt
	}
}

query LibraryAnalysisJob($id: ID!) {
	ingestAnalysisJob(id: $id) {
		id
		status
		phase
		error
	}
}

mutation RunLibraryQuality($mediaIds: [ID!]!) {
	runLibraryQuality(mediaIds: $mediaIds) {
		id
		status
		phase
	}
}

mutation MatchLibraryMedia($mediaIds: [ID!]!, $providers: [String!]) {
	matchLibraryMedia(mediaIds: $mediaIds, providers: $providers) {
		id
		status
		phase
	}
}

mutation ApplyBestIngestMetadata($mediaId: ID!) {
	applyBestIngestMetadata(mediaId: $mediaId) {
		media {
			id
		}
		decisions {
			field
			strategy
			outcome
			providers
			applied
		}
	}
}

# The devices a book can be mailed to. Only rows with a `kindleEmail` are
# targets, so a book row offers "Send to Kindle" only when one exists.
query EditorKindleTargets {
	devices {
		id
		name
		kindleEmail
		revokedAt
	}
}

mutation EditorSendToKindle($mediaId: ID!, $deviceId: ID!) {
	sendToKindle(mediaId: $mediaId, deviceId: $deviceId) {
		deviceId
		deviceName
		recipient
		format
		bytes
		converted
		note
	}
}
