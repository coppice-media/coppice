# Shared GraphQL operations used by more than one Stump companion app
# (the ingest editor and the Home app). App-specific operations live in the
# apps themselves (`editor/src/lib/graphql/operations.graphql` and
# `home/src/lib/graphql/operations.graphql`).

query Me {
	me {
		id
		username
		isServerOwner
		oidcEmail
		lastLogin
		loginSessionsCount
		# The shells gate their own links on this: the Home app only offers
		# the ingest editor to someone who can actually use it.
		permissions
	}
}
