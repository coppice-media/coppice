[package]
name = "stump_server"
version.workspace = true
edition = "2021"
default-run = "stump_server"

[features]
default = ["full"]
full = ["headless", "webui"]
headless = ["formats", "graphql", "opds", "readium", "kobo", "koreader", "komga", "kavita", "liseur-sync", "providers", "watcher", "qr", "ingest", "apalis"]
# Apalis-backed job executor (links `apalis`); `minimal` runs jobs on the inline executor.
apalis = ["stump_core/apalis"]
# Media format backends that link native code; every profile keeps them on.
# Turn one off explicitly (e.g. `--no-default-features --features minimal,rar`).
formats = ["pdf", "rar", "transform"]
pdf = ["stump_core/pdf", "stump_media/pdf"]
rar = ["stump_core/rar", "stump_media/rar"]
transform = ["stump_media/turbojpeg", "stump_media/fast-resize", "stump_media/kepub"]
graphql = [
  "dep:async-graphql",
  "dep:async-graphql-axum",
  "dep:graphql",
  "models/graphql",
  "stump_core/graphql",
]
# The staged ingest pipeline (`stump_ingest` + `Ctx::ingest`): drop folder,
# analysis queue, quality reports, metadata candidates, and the ingest SSE
# route. `minimal` omits it, so neither the crate nor the route is compiled.
ingest = ["dep:stump_ingest", "stump_core/ingest"]
minimal = ["formats"]
opds = ["dep:stump_opds"]
readium = []
kobo = ["dep:stump_kobo", "dep:stump_kepub", "dep:stump_collections"]
koreader = ["dep:stump_koreader"]
komga = ["readium", "dep:stump_komga", "dep:stump_collections", "dep:stump_library"]
kavita = ["dep:stump_kavita", "dep:stump_collections"]
liseur-sync = ["dep:stump_liseur_sync"]
providers = [
	"dep:stump_provider",
	"dep:stump_provider_mangadex",
	"dep:stump_provider_themes",
	"stump_core/providers",
	"graphql?/providers",
]
# Server-rendered PNG for the device-pairing QR payload (links `qrcode` + `image`
# PNG encoding); omitted from `minimal`.
qr = ["dep:qrcode", "dep:image"]
# Filesystem library watcher (links `notify`); omitted from `minimal`.
watcher = ["stump_core/watcher"]
# Serves the bundled React SPA and forwards the GraphQL resolvers only that SPA
# (and the Expo app) reaches; `headless` deliberately omits it, `full` has it.
webui = ["graphql?/web"]

[dependencies]
alphanumeric-sort.workspace = true
async-graphql = { workspace = true, optional = true }
async-graphql-axum = { workspace = true, optional = true }
async-stream.workspace = true
async-trait.workspace = true
axum.workspace = true
axum-macros = "0.5.0"
axum_typed_multipart = "0.15.1"
axum-extra = { version = "0.10.0", features = [
  "typed-header",
  "query",
] }
base64.workspace = true
bcrypt.workspace = true
cli = { path = "../../crates/cli" }
chrono.workspace = true
data-encoding.workspace = true
models = { path = "../../crates/models", default-features = false }
futures-util.workspace = true
graphql = { path = "../../crates/graphql", optional = true, default-features = false }
governor = "0.6"
hyper = "0.14.27"
http-body = "1"
infer.workspace = true
image = { version = "0.25.2", default-features = false, features = ["png"], optional = true }
itertools.workspace = true
jsonwebtoken = "9.3.0"
linemux = { git = "https://github.com/jmagnuson/linemux.git", rev = "acaafc602afac5d7a9cd3e087dafc937cac1e364" }
local-ip-address = "0.6.2"
openidconnect = { version = "4.0.1", default-features = false }
oauth2-reqwest = { version = "0.1.0-alpha.3" }
prefixed-api-key = { workspace = true}
qrcode = { workspace = true, optional = true }
rand = { workspace = true }
reqwest.workspace = true
sea-orm.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_qs = { version = "0.14.0", features = ["axum"] }
serde-untagged = "0.1.2"
serde_with.workspace = true
sha2 = "0.10"
stump_core = { path = "../../core", default-features = false }
stump_collections = { path = "../../crates/collections", optional = true }
stump_ingest = { path = "../../crates/ingest", optional = true }
stump_library = { path = "../../crates/library", optional = true }
stump_media = { path = "../../crates/media", default-features = false }
stump_scanner = { path = "../../crates/scanner" }
stump_auth = { path = "../../crates/auth" }
stump_api_types = { path = "../../crates/api-types" }
stump_devices = { path = "../../crates/devices" }
stump_komga = { path = "../../crates/komga", optional = true }
stump_kavita = { path = "../../crates/kavita", optional = true }
stump_kobo = { path = "../../crates/kobo", optional = true }
stump_kepub = { path = "../../crates/kepub", optional = true }
filetime = "0.2.25"
stump_koreader = { path = "../../crates/koreader", optional = true }
stump_liseur_sync = { path = "../../crates/liseur-sync", optional = true }
stump_opds = { path = "../../crates/opds", optional = true }
stump_provider = { path = "../../crates/provider", optional = true }
stump_provider_mangadex = { path = "../../crates/provider-mangadex", optional = true }
stump_provider_themes = { path = "../../crates/provider-themes", optional = true }
subtle.workspace = true
tempfile = "3.13.0"
tower-http = { version = "0.5.2", features = [
  "fs",
  "cors",
  "set-header",
  "trace",
  "compression-full"
] }
thiserror.workspace = true
time = "0.3.36"
tokio = { workspace = true }
tokio-util = "0.7.10"
tower = "0.4.13"
tower-sessions = "0.14.0"
tracing.workspace = true
urlencoding.workspace = true
uuid.workspace = true
zip.workspace = true

[dev-dependencies]
axum-test = "17.2.0"
maplit.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tests = { path = "../../crates/tests" }
migrations = { path = "../../crates/migrations", default-features = false }
tempfile.workspace = true

[build-dependencies]
chrono.workspace = true

[target.aarch64-unknown-linux-musl.dependencies]
openssl = { version = "0.10.66", features = ["vendored"] }

[target.armv7-unknown-linux-musleabihf.dependencies]
openssl = { version = "0.10.66", features = ["vendored"] }

[target.x86_64-unknown-linux-musl.dependencies]
openssl = { version = "0.10.66", features = ["vendored"] }
