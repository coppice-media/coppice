[package]
name = "mam-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "A narrow, private MAM Torznab and qBittorrent gateway for Coppice"
license = "MIT"
publish = false

[workspace]
resolver = "2"

[dependencies]
axum = { version = "0.8.6", features = ["macros"] }
bytes = "1.10.1"
futures-util = "0.3.31"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "multipart", "query", "rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.5.0"
thiserror = "2.0.17"
tokio = { version = "1.47.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.23.0"
