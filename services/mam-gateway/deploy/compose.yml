name: coppice-private-mam

# Create this network once, outside this file, so Coppice and the VPN namespace
# share only a private control plane:
#   docker network create --driver bridge --internal coppice-control
services:
  gluetun:
    image: qmcgaw/gluetun:v3.40.0
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - .env
    environment:
      FIREWALL_INPUT_PORTS: "8088"
    networks:
      coppice-control:
        aliases:
          - vpn-gateway
    # Do not publish this port. The Coppice control network is the only route.
    expose:
      - "8088"

  mam-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    network_mode: service:gluetun
    # Match qBittorrent's PUID so the read-only handoff mount is readable.
    user: "1000:1000"
    depends_on:
      gluetun:
        condition: service_started
      qbittorrent:
        condition: service_started
    environment:
      MAM_GATEWAY_BIND: "0.0.0.0:8088"
      MAM_BASE_URL: "https://t.myanonamouse.net"
      MAM_COOKIE_FILE: /run/secrets/mam_cookie
      MAM_GATEWAY_TOKEN_FILE: /run/secrets/gateway_token
      QBIT_URL: "http://127.0.0.1:8080"
      MAM_GATEWAY_TIMEOUT_SECS: "15"
      MAM_GATEWAY_HANDOFF_ROOT: /downloads
    secrets:
      - mam_cookie
      - gateway_token
    volumes:
      # The gateway only hashes completed payloads; qBittorrent is the writer.
      - ./downloads:/downloads:ro
    # network_mode shares Gluetun's namespace; there is intentionally no ports:
    # stanza here, so the gateway is not exposed on the host.
    expose:
      - "8088"

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.1.2
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_started
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - ./qbittorrent-config:/config
      - ./downloads:/downloads
    # qBittorrent must listen on loopback in the shared namespace. Keep this
    # setting in qBittorrent.conf and verify it after the first startup:
    # [Preferences] WebUI\Address=127.0.0.1, WebUI\Port=8080.
    expose:
      - "8080"

secrets:
  mam_cookie:
    file: ./secrets/mam_cookie
  gateway_token:
    file: ./secrets/gateway_token

networks:
  coppice-control:
    external: true
